name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # каждую среду в 12:30 UTC
    - cron: '30 12 * * 3'
    # каждую пятницу в 22:00 UTC
    - cron: '0 22 * * 5'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build
