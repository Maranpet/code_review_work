name: Java CI with Gradle (Multi-platform, Multi-version)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 12 * * 3'   # среда 12:30 UTC
    - cron: '0 22 * * 5'    # пятница 22:00 UTC

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: [11, 13, 17]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'zulu'   # Zulu поддерживает Java 13

      - name: Make gradlew executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build and test with Gradle (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew build

      - name: Build and test with Gradle (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat build
